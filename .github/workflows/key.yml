name: 1. Generate Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key Alias (contoh: kanji-key)'
        required: true
        default: 'kanji-key'
      password:
        description: 'Password Keystore (minimal 6 karakter)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Keystore & Base64
        run: |
          keytool -genkey -v -keystore keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "${{ github.event.inputs.alias }}" \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=Developer, OU=App, O=Personal, L=Bandung, S=West Java, C=ID"
          
          base64 -w 0 keystore.jks > keystore_base64.txt

      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            keystore.jks
            keystore_base64.txt
