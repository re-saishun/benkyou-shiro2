name: Build Release

on:
  release:
    types: [published]
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (opsional)
        id: keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          SIGN_PASS: ${{ secrets.SIGN_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew app:assembleFdroidRelease --stacktrace --no-daemon

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        run: |
          chmod +x gradlew
          ./gradlew app:assembleFdroidDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/fdroid -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"; find app/build/outputs -type f | head -50; exit 1
          fi
          cp "$APK" "dist/Benkyou-Shiro-${GITHUB_REF_NAME//\//-}.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
